version: "3.8"

services:
  oci-mc-admin:
    build: .
    container_name: oci-mc-admin
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - dokploy-network
    environment:
      - MC_SERVER_HOST=51.170.48.83
      - MC_SSH_USER=ubuntu
      - MC_SSH_KEY=/root/.ssh/id_ed25519_oci
      - MC_CONTAINER=minecraft-bedrock
      - MC_DATA_DIR=/opt/minecraft-bedrock/data
      - MC_SSH_PORT=22
      - BACKUP_DIR=/opt/minecraft-bedrock/backups
      - BACKUP_RETENTION=7
      # Cloudflare Zero Trust — configurar en Dokploy
      - CF_TEAM_DOMAIN=${CF_TEAM_DOMAIN}
      - CF_APP_AUD=${CF_APP_AUD:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
    volumes:
      - /home/ubuntu/.ssh/id_ed25519_oci_new:/root/.ssh/id_ed25519_oci:ro
    labels:
      - "traefik.enable=false"

networks:
  dokploy-network:
    external: true
