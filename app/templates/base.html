<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}oci-mc-admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        surface: {
                            950: '#0a0a0f',
                            900: '#0f1117',
                            850: '#14171f',
                            800: '#1a1e28',
                            700: '#252a36',
                            600: '#2f3644',
                        },
                        accent: {
                            DEFAULT: '#10b981',
                            hover: '#059669',
                            dim: '#064e3b',
                            glow: 'rgba(16,185,129,0.15)',
                        },
                        danger: '#ef4444',
                        warn: '#f59e0b',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                    }
                }
            }
        }
    </script>
    <style>
        /* ── Base ───────────────────────────────────────────────── */
        * { scrollbar-width: thin; scrollbar-color: #2f3644 transparent; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2f3644; border-radius: 3px; }

        body { background: #0a0a0f; font-family: 'Inter', system-ui, sans-serif; }

        /* ── Components ───────────────────────────────────────── */
        .card {
            background: #0f1117;
            border: 1px solid #1a1e28;
            border-radius: 0.75rem;
            transition: border-color 0.2s ease;
        }
        .card:hover { border-color: #252a36; }

        .btn-primary {
            background: #10b981;
            color: #052e16;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.15s ease;
        }
        .btn-primary:hover { background: #059669; }
        .btn-primary:active { transform: scale(0.98); }

        .btn-ghost {
            color: #9ca3af;
            padding: 0.375rem 0.75rem;
            border-radius: 0.5rem;
            transition: all 0.15s ease;
        }
        .btn-ghost:hover { background: #1a1e28; color: #e5e7eb; }

        .stat-card {
            background: #0f1117;
            border: 1px solid #1a1e28;
            border-radius: 0.75rem;
            padding: 1.25rem;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e5e7eb;
            font-family: 'JetBrains Mono', monospace;
        }
        .stat-label {
            font-size: 0.6875rem;
            font-weight: 500;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        /* ── Terminal ─────────────────────────────────────────── */
        .terminal {
            background: #0a0a0f;
            border: 1px solid #1a1e28;
            border-radius: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8125rem;
            line-height: 1.6;
        }
        .terminal-line { padding: 0.125rem 0; }
        .terminal-prompt { color: #10b981; font-weight: 600; }
        .terminal-input {
            background: transparent;
            border: none;
            outline: none;
            color: #e5e7eb;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8125rem;
            width: 100%;
        }

        /* ── Toast ────────────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: #0f1117;
            border: 1px solid #252a36;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 50;
            animation: slideUp 0.3s ease-out;
        }
        .toast-success { border-color: #10b981; }
        .toast-error { border-color: #ef4444; }

        /* ── HTMX ─────────────────────────────────────────────── */
        .htmx-swapping { opacity: 0; transition: opacity 0.1s ease; }
        .htmx-added { opacity: 0; }
        .htmx-settling { opacity: 1; transition: opacity 0.2s ease; }

        /* ── Nav active state ─────────────────────────────────── */
        .nav-link {
            color: #6b7280;
            padding: 0.375rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.8125rem;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .nav-link:hover { color: #e5e7eb; background: #1a1e28; }
        .nav-link.active { color: #10b981; background: rgba(16,185,129,0.1); }

        /* ── Player avatar ────────────────────────────────────── */
        .player-avatar {
            width: 2rem;
            height: 2rem;
            background: linear-gradient(135deg, #8B6B4A 0%, #5D8C3E 100%);
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.75rem;
            color: #fff;
        }
    </style>
</head>
<body class="h-full text-gray-200 antialiased">

<div class="min-h-full">
    <!-- Nav -->
    <nav class="sticky top-0 z-40 bg-surface-950/80 backdrop-blur-md border-b border-surface-800">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-14 items-center justify-between">
                <div class="flex items-center gap-4">
                    <a href="/" class="flex items-center gap-2.5 group">
                        <div class="w-8 h-8 bg-accent-dim rounded-lg flex items-center justify-center group-hover:bg-accent/20 transition-colors">
                            <svg class="w-4.5 h-4.5 text-accent" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 004.486-6.336l-3.276 3.277a3.004 3.004 0 01-2.25-2.25l3.276-3.276a4.5 4.5 0 00-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437l1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008z" />
                            </svg>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm font-semibold text-gray-100 tracking-tight">oci-mc-admin</span>
                            <span class="text-[0.625rem] text-gray-500">Mundo D&D</span>
                        </div>
                    </a>
                </div>

                <div class="flex items-center gap-1">
                    {% set nav_items = [
                        ('/', 'dashboard', '<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />'),
                        ('/console', 'console', '<path stroke-linecap="round" stroke-linejoin="round" d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0021 18V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v12a2.25 2.25 0 002.25 2.25z" />'),
                        ('/whitelist', 'whitelist', '<path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />'),
                        ('/logs', 'logs', '<path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />'),
                        ('/backups', 'backups', '<path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />'),
                    ] %}
                    {% for href, id, icon in nav_items %}
                    <a href="{{ href }}"
                       class="nav-link flex items-center gap-1.5 {% if active == id %}active{% endif %}">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            {{ icon|safe }}
                        </svg>
                        <span class="hidden sm:inline">{{ id|title }}</span>
                    </a>
                    {% endfor %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
    // Toast notification system
    function showToast(message, type = 'success', duration = 3000) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type} animate-fade-in`;
        toast.innerHTML = `
            <div class="flex items-center gap-2">
                ${type === 'success' ? '<span class="text-accent">✓</span>' : '<span class="text-danger">✗</span>'}
                <span>${message}</span>
            </div>
        `;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.2s ease';
            setTimeout(() => toast.remove(), 200);
        }, duration);
    }

    // HTMX event hooks for toasts
    document.body.addEventListener('htmx:afterRequest', (e) => {
        if (e.detail.xhr.status >= 200 && e.detail.xhr.status < 300) {
            // Success — handled by templates
        } else {
            showToast('Error en la operación', 'error');
        }
    });
</script>

</body>
</html>
