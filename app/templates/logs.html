{% extends "base.html" %}
{% block title %}Logs — oci-mc-admin{% endblock %}
{% block content %}

<div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-gray-100 tracking-tight">Logs</h2>
        <div class="flex items-center gap-1">
            {% for n in [50, 100, 200, 500] %}
            <a href="/logs?lines={{ n }}"
               class="px-2.5 py-1.5 text-xs rounded-md transition-colors
                      {% if lines == n %}bg-surface-700 text-gray-200{% else %}text-gray-500 hover:text-gray-300 hover:bg-surface-800{% endif %}">
                {{ n }}
            </a>
            {% endfor %}
        </div>
    </div>

    <div class="card overflow-hidden">
        <div class="flex items-center justify-between px-4 py-2 bg-surface-850 border-b border-surface-700">
            <span class="text-xs text-gray-500 font-mono">{{ lines }} líneas</span>
            <button onclick="copyLogs()" class="btn-ghost text-xs p-1" title="Copiar">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" />
                </svg>
            </button>
        </div>
        <div class="terminal p-4 max-h-[600px] overflow-y-auto" id="logs-terminal">
            {% if log_text %}
            <pre class="text-gray-400 whitespace-pre-wrap break-words text-xs leading-relaxed">{{ log_text }}</pre>
            {% else %}
            <p class="text-gray-600 text-sm text-center py-8">No hay logs disponibles</p>
            {% endif %}
        </div>
    </div>
</div>

<script>
function copyLogs() {
    const text = document.getElementById('logs-terminal')?.innerText || '';
    navigator.clipboard.writeText(text).then(() => showToast('Logs copiados', 'success'));
}
</script>

{% endblock %}
